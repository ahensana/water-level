<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Real-time water level monitoring dashboard for reservoir, dam, tank and lake infrastructure." />
    <meta name="theme-color" content="#0f62fe" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Water Level Monitoring System</title>
    <script>
      // Applies the theme before first paint. useTheme sets this class too, but
      // only in an effect - by then the page has already painted, so without
      // this the dark default flashes white on every load. Keep the key and the
      // fallback in sync with src/hooks/useTheme.ts.
      (function () {
        try {
          var stored = localStorage.getItem("wlms.theme");
          if (stored !== "light") document.documentElement.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
