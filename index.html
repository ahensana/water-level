<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Water Monitor</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #071827, #0f2f4a);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .card {
            width: 360px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .live {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(34, 197, 94, 0.15);
            color: #86efac;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
        }

        .value {
            font-size: 64px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .unit {
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .bar {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #38bdf8, #0ea5e9);
            transition: width 0.5s ease;
        }

        .status {
            display: inline-block;
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .normal {
            background: rgba(34, 197, 94, 0.18);
            color: #86efac;
        }

        .near {
            background: rgba(239, 68, 68, 0.18);
            color: #fca5a5;
        }

        .far {
            background: rgba(251, 191, 36, 0.18);
            color: #fde68a;
        }

        .footer {
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Water Monitor</h1>

        <div class="live">
            <div class="dot"></div>
            LIVE
        </div>

        <div class="value" id="distance">--</div>
        <div class="unit">metres</div>

        <div class="bar">
            <div class="fill" id="barFill"></div>
        </div>

        <div class="status normal" id="status">Connecting...</div>

        <div class="footer" id="updated">Waiting for data...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAO9c2skhrD9E44H1_vQnWbvGx-OEmJztA",
            authDomain: "water-level-ae453.firebaseapp.com",
            databaseURL: "https://water-level-ae453-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "water-level-ae453",
            storageBucket: "water-level-ae453.firebasestorage.app",
            messagingSenderId: "315746351135",
            appId: "1:315746351135:web:afb27d3880cdc0ddc3bd2a",
            measurementId: "G-LMSQ36S4KY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const waterRef = ref(db, "water_monitor");

        const MAX_DISTANCE_M = 3.0;

        onValue(waterRef, (snapshot) => {
            const data = snapshot.val();

            if (!data) return;

            const distanceM = Number(data.depth_m || 0);
            const status = data.status || "Unknown";

            document.getElementById("distance").textContent = distanceM.toFixed(2);

            const percent = Math.min((distanceM / MAX_DISTANCE_M) * 100, 100);
            document.getElementById("barFill").style.width = percent + "%";

            const statusEl = document.getElementById("status");
            statusEl.textContent = status;
            statusEl.className = "status";

            if (status.toLowerCase().includes("near")) {
                statusEl.classList.add("near");
            } else if (status.toLowerCase().includes("far")) {
                statusEl.classList.add("far");
            } else {
                statusEl.classList.add("normal");
            }

            document.getElementById("updated").textContent = "Updated: " + (data.updated_at || "LIVE");
        });
    </script>
</body>

</html>
